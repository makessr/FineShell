name: macOS and Linux public v0.6.0 OTA acceptance

on:
  push:
    branches: [test/public-desktop-ota-v060]

permissions:
  contents: read

env:
  BASELINE: "0.5.1"
  TARGET: "0.6.0"

defaults:
  run:
    shell: bash

jobs:
  upgrade:
    if: github.repository == 'makessr/FineShell'
    name: ${{ matrix.name }} public OTA
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-22.04
            arch: amd64
            artifact: FineShell_0.5.1_linux_amd64.deb
            digest: 731e3a28a8d8e367145074975085ccb42b50adc933bd1cde4793da892f569d92
          - name: Linux ARM64
            runner: ubuntu-22.04-arm
            arch: arm64
            artifact: FineShell_0.5.1_linux_arm64.deb
            digest: 6c2cb8883983064f1fb38bf26941520493191557b7214a3cacd8150c627f891b
          - name: macOS Intel
            runner: macos-15-intel
            arch: x86_64
            artifact: FineShell_0.5.1_darwin_x64.dmg
            digest: 6a386bb79c1f670d1151c153bf55a3110ba72f6f302d1dad46d73d9ef962608f
          - name: macOS Apple Silicon
            runner: macos-15
            arch: arm64
            artifact: FineShell_0.5.1_darwin_aarch64.dmg
            digest: 1d70aa526f8fe25536d5d55a97c68004f569adeb8b42407819985f8978cae5f2
    env:
      ARCH: ${{ matrix.arch }}
      ARTIFACT: ${{ matrix.artifact }}
      DIGEST: ${{ matrix.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify the official channel and baseline installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          test "$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" = "v$TARGET"
          gh release download "v$BASELINE" --repo "$GITHUB_REPOSITORY" --pattern "$ARTIFACT"
          if [[ "$RUNNER_OS" == Linux ]]; then
            printf '%s  %s\n' "$DIGEST" "$ARTIFACT" | sha256sum --check
            test "$(dpkg --print-architecture)" = "$ARCH"
            test "$(dpkg-deb -f "$ARTIFACT" Architecture)" = "$ARCH"
          else
            printf '%s  %s\n' "$DIGEST" "$ARTIFACT" | shasum -a 256 --check
            test "$(uname -m)" = "$ARCH"
          fi
      - name: Install the Linux baseline and isolated desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends "$RUNNER_TEMP/$ARTIFACT" xvfb xauth xdotool x11-utils dbus-x11 at-spi2-core python3-pyatspi
      - name: Upgrade through the Linux desktop
        if: runner.os == 'Linux'
        run: |
          test "$(id -u)" -ne 0
          sudo -n true
          package_name="$(dpkg-deb -f "$RUNNER_TEMP/$ARTIFACT" Package)"
          xvfb-run -a -s '-screen 0 1440x1000x24' dbus-run-session -- bash scripts/linux-smoke/ota.sh "$package_name" "$BASELINE" "$TARGET" '栈渡'
      - name: Upgrade through the macOS desktop
        if: runner.os == 'macOS'
        run: bash scripts/macos-smoke/ota.sh "$RUNNER_TEMP/$ARTIFACT" "$ARCH" "$BASELINE" "$TARGET"
